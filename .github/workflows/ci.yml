name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"

jobs:
  # Comprobaciones rápidas y baratas: se ejecutan en paralelo (AGENTS.md §10).
  static:
    name: Tipos · lint · fronteras · i18n
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @nexo/design-tokens build
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm check:boundaries
      - run: node tools/boundaries-selftest.mjs
      - run: pnpm check:i18n

  # Unitarias + integración (PostgreSQL real con Testcontainers) + AISLAMIENTO (bloqueante).
  test:
    name: Tests (unit · integración · aislamiento)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @nexo/design-tokens build
      - run: pnpm test:coverage
      - run: pnpm test:isolation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: "**/coverage"
          if-no-files-found: ignore

  build:
    name: Build (api · web · imágenes)
    runs-on: ubuntu-latest
    needs: [static]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Las imágenes se construyen pero NO se publican: el despliegue requiere autorización (AGENTS.md §4).
      - run: docker build -f docker/Dockerfile.api -t nexo-api:ci .
      - run: docker build -f docker/Dockerfile.web -t nexo-web:ci .

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: [static]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @nexo/design-tokens build
      - run: pnpm --filter @nexo/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
