# Infraestructura LOCAL de desarrollo (NO es el despliegue de producción; ver ARCHITECTURE §16).
# Arranque: `pnpm infra:up`. Datos efímeros salvo el volumen de PostgreSQL.
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: nexo_owner
      POSTGRES_PASSWORD: nexo_owner_dev
      POSTGRES_DB: nexo
    ports:
      - "5432:5432"
    volumes:
      - nexo_pg:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexo_owner -d nexo"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Almacenamiento S3-compatible (ARCHITECTURE §12). Consola en http://localhost:9001
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: nexo_dev
      MINIO_ROOT_PASSWORD: nexo_dev_secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - nexo_minio:/data

  # Bandeja de correo de desarrollo: SMTP en :1025, interfaz en http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  nexo_pg:
  nexo_minio:
