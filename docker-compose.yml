# Infraestructura LOCAL de desarrollo (NO es el despliegue de producción; ver ARCHITECTURE §16).
# Arranque: `pnpm infra:up`. Datos efímeros salvo el volumen de PostgreSQL.
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: nexo_owner
      POSTGRES_PASSWORD: nexo_owner_dev
      POSTGRES_DB: nexo
    ports:
      - "5432:5432"
    volumes:
      - nexo_pg:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexo_owner -d nexo"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Almacenamiento S3-compatible (ARCHITECTURE §12): SeaweedFS (MinIO dejó de publicar imágenes
  # gratuitas, ver ADR 0003). Endpoint S3 en http://localhost:9000.
  s3:
    image: chrislusf/seaweedfs:latest
    command: server -s3 -dir=/data -s3.port=9000 -ip=s3
    environment:
      AWS_ACCESS_KEY_ID: nexo_dev
      AWS_SECRET_ACCESS_KEY: nexo_dev_secret
    ports:
      - "9000:9000"
    volumes:
      - nexo_s3:/data

  # Bandeja de correo de desarrollo: SMTP en :1025, interfaz en http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  nexo_pg:
  nexo_s3:
